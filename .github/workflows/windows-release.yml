name: Windows desktop release

on:
  workflow_dispatch:
  push:
    branches: ['desktop/windows-release-*']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: hackrf-tools
          init-shell: none
          create-args: >-
            --channel conda-forge
            --strict-channel-priority
            hackrf=2026.01.3
          # Restoring only the environment omits extracted package recipes/licenses.
          # Recreate the small tools environment from cached, verified downloads.
          cache-environment: false
          cache-downloads: true
      - name: Build and test desktop installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Start-Transcript -Path build/windows-build.log
          try {
            if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
              choco install nsis --yes --no-progress
              if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed." }
            }
            ./packaging/windows/build.ps1 -HackRfPrefix "$env:MAMBA_ROOT_PREFIX\envs\hackrf-tools"
          } catch {
            $Details = (Get-Content build/windows-build.log -Tail 80 | Out-String) + ($_ | Out-String)
            $Details = $Details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows installer build failed::$Details"
            throw
          } finally {
            Stop-Transcript
          }
      - name: Generate checksum
        shell: pwsh
        run: |
          $Hash = (Get-FileHash dist/TinfoilHat-Setup-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$Hash  TinfoilHat-Setup-x64.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: TinfoilHat-Windows-x64
          path: |
            dist/TinfoilHat-Setup-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-smoke-reports
          path: build/*smoke-test.json
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TinfoilHat-Windows-x64
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "Tinfoil Hat $RELEASE_TAG (Windows)" \
            --notes "Windows x64 installer with bundled Python, application libraries, HackRF tools, and the Microsoft WebView2 offline runtime installer. A HackRF One and a compatible WinUSB driver are required for RF measurements."
